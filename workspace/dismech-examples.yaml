# A couple example assertions from the DisMech Cystic Fibrosis record here: https://github.com/monarch-initiative/dismech/blob/main/kb/disorders/Cystic_Fibrosis.yaml (copied 7-29-26)
# Below I show how SEPIO might represent the evidence for these assertions that DisMech captures in its Evidence Item objects.


## The DisMech source representation of a couple Pathophysiology Assertions for Cystic Fibrosis

name: Cystic Fibrosis

## Pathophysiology Assertion 1: "Cystic Fibrosis has_pathophysiology CFTR Dysfunction"
pathophysiology:             # each object here represents a discrete assertion that a particular pathophysiological feature is associated with CF
- name: CFTR Dysfunction
  description: >-
    Mutations in the CFTR gene reduce or eliminate CFTR channel function at
    epithelial surfaces. Defective CFTR impairs epithelial anion and water
    handling, creating dehydrated secretions that initiate respiratory,
    gastrointestinal, hepatobiliary, sweat-gland, and reproductive disease.
  cell_types:
  - preferred_term: Epithelial cell
    term:
      id: CL:0000066
      label: epithelial cell
  biological_processes:
  - preferred_term: Chloride Transport
    modifier: DECREASED
    term:
      id: GO:0006821
      label: chloride transport
  - preferred_term: bicarbonate transport
    modifier: DECREASED
    term:
      id: GO:0015701
      label: bicarbonate transport
  evidence:
  - reference: PMID:9922375
    reference_title: "Structure and function of the CFTR chloride channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The cystic fibrosis transmembrane conductance regulator (CFTR) is a unique member of the ABC transporter family that forms a novel Cl- channel. It is located predominantly in the apical membrane of epithelia where it mediates transepithelial salt and liquid movement. Dysfunction of CFTR causes the genetic disease cystic fibrosis."
    explanation: Comprehensive review establishes CFTR as chloride channel whose dysfunction causes cystic fibrosis.
  - reference: PMID:9922375
    reference_title: "Structure and function of the CFTR chloride channel."
    supports: SUPPORT
    evidence_source: HUMAN_CLINICAL
    snippet: "The CFTR is composed of five domains: two membrane-spanning domains (MSDs), two nucleotide-binding domains (NBDs), and a regulatory (R) domain."
    explanation: Describes the five-domain architecture of CFTR critical to understanding mutation effects.


## A SEPIO Representation of the evidence for Pathophysiology Assertion 1

 has_evidence_lines:                             # instead of dismech:evidence, use this sepio:has_evidence_lines property
  - type: EvidenceLine
    evidence_type: HUMAN_CLINICAL                # casts dismech:evidence_source as describing a type of evidence being applied here
    direction_of_evidence_provided: SUPPORT      # casts dismech:supports as sepio:direction_of_evidence_provided - as most terms in the dismech:EvidenceItemSupportEnum represent the direction the evidence as supporting or disputing the assertion
    has_evidence_items:                          # captures the discrete informationentities that are interpreted as evidence for the assertion (here, a single span of text) 
      - id: ex:EvidenceItem001
        type: DataItem                
        data_type: TextSpan                      # Alt, we could make TextSpan as a proper class in SEPIO it there are unique attributes we want to represent for these types of data items
        value: "The cystic fibrosis transmembrane conductance regulator (CFTR) is a unique member of the ABC transporter family that forms a novel Cl- channel. It is located predominantly in the apical membrane of epithelia where it mediates transepithelial salt and liquid movement. Dysfunction of CFTR causes the genetic disease cystic fibrosis."        reportedIn:
        reported_in:                             # captures the document/publication the text span came from
          id: PMID:9922375
          type: Document
          document_type: PRIMARY_LITERATURE      # this is not in the dismech data, but is supported by SEPIO and may be a valuable addition to dismech
          title: "Structure and function of the CFTR chloride channel."
    description: Comprehensive review establishes CFTR as chloride channel whose dysfunction causes cystic fibrosis.    # the dismech:explanation is cast into the sepio:EvidenceLine.description field. But a dedicated 'rationale/explanation' field could be added to sepio.
  - type: EvidenceLine                           # a separate evidence line to describe interpretation of a different snippet as evidence for/against the assertion.
    evidence_type: HUMAN_CLINICAL
    direction_of_evidence_provided: SUPPORT
    has_evidence_items:
      - id: ex:EvidenceItem002
        type: DataItem                
        data_type: TextSpan
        value: "The CFTR is composed of five domains: two membrane-spanning domains (MSDs), two nucleotide-binding domains (NBDs), and a regulatory (R) domain."
        reported_in:
          id: PMID:9922375
          type: Document
          document_type: PRIMARY_LITERATURE
          title: "Structure and function of the CFTR chloride channel."
    description: Describes the five-domain architecture of CFTR critical to understanding mutation effects.


